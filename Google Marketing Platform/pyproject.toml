[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmp-access"
version = "0.2.0"
description = "Unified Google Analytics, Tag Manager, Search Console, and Ads access agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-ads>=31,<32",
  "google-analytics-admin==0.30.1",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
gmp = "gmp_access.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
