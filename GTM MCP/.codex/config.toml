[mcp_servers.gtm]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/bootstrap-mcp.ps1"]
env_vars = ["GTM_ACCOUNT_ID", "GTM_CONTAINER_ID", "GTM_WORKSPACE_ID", "GTM_READ_ONLY", "GOOGLE_APPLICATION_CREDENTIALS"]
startup_timeout_sec = 180
tool_timeout_sec = 120
enabled = true
required = false
default_tools_approval_mode = "auto"
