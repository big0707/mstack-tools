[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-mcp-agent"
version = "0.1.0"
description = "A portable Google Tag Manager MCP server for Cursor and Codex agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "mcp>=1.29,<2",
  "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
gtm-mcp = "gtm_agent.cli:main"
gtm-mcp-server = "gtm_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
