[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-mcp-agent"
version = "0.2.0"
description = "A portable GA4 reporting and audience-management MCP server for Cursor and Codex agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-analytics-admin==0.30.1",
  "google-analytics-data==0.23.0",
  "mcp>=1.29,<2",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
ga4-mcp = "ga4_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
